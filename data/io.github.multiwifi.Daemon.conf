<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root user can own the MultiWiFi daemon service name -->
  <policy user="root">
    <allow own="io.github.multiwifi.Daemon"/>
    <allow send_destination="io.github.multiwifi.Daemon"/>
    <allow receive_sender="io.github.multiwifi.Daemon"/>
  </policy>

  <!-- Any local user can call read-only methods and receive signals -->
  <policy context="default">
    <allow send_destination="io.github.multiwifi.Daemon"/>
    <allow receive_sender="io.github.multiwifi.Daemon"/>
  </policy>
</busconfig>
